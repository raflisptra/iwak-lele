# /etc/nginx/sites-available/smartpond
# Reverse proxy KHUSUS dashboard; tidak meneruskan /ingest/http atau /ingest/ws.
server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location = /api/latest {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location = /api/history {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
